# Required metadata
sonar.projectKey=com.ericsson.docgen:eric-sdui-docgen-libcommon-py
sonar.projectName=eric-sdui-docgen-libcommon-py
sonar.host.url=https://sonarqube.rosetta.ericssondevops.com
sonar.projectVersion=1.0

# Comma-separated paths to directories with sources (required)
sonar.sources=eric_sdui_docgen_libcommon_py
sonar.projectBaseDir=.

# Language
sonar.language=py,yaml,yml

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Unit tests
sonar.python.xunit.reportPath=test-reports/*.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**,**/utils.py,**/__init__.py

# Integration tests
sonar.python.coverage.itReportPaths=it-coverage.xml


sonar.python.pylint=/usr/local/bin/pylint
sonar.python.pylint_config=.pylintrc
sonar.python.pylint.reportPaths=pylint-report.txt
